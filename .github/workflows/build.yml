name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests and static analysis
        run: ./gradlew test lintDebug

  release:
    name: Build & Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    env:
      HAS_VT_API_KEY: ${{ secrets.VT_API_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Build signed APKs
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Cleanup keystore
        if: always()
        run: rm -f app/release.jks

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: altshift-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: altshift-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: Scan release APK with VirusTotal
        if: env.HAS_VT_API_KEY == 'true'
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APK_NAME=$(basename "$APK_PATH")
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          
          curl -fsS -X POST "https://www.virustotal.com/api/v3/files" \
            -H "x-apikey: $VT_API_KEY" \
            -F "file=@$APK_PATH" > /dev/null
          
          EXISTING_BODY=$(gh release view "${{ github.ref_name }}" --json body -q .body)
          
          NEW_BODY=$(APK_NAME="$APK_NAME" SHA256="$SHA256" EXISTING_BODY="$EXISTING_BODY" python3 - <<'PY'
          import os, re
          
          apk_name = os.environ["APK_NAME"]
          sha256 = os.environ["SHA256"]
          body = os.environ["EXISTING_BODY"].replace("\r\n", "\n").strip()
          
          security = (
              f"### 🛡️ Security & Analysis (`{apk_name}`)\n\n"
              f"* **VirusTotal:** [Scan report](https://www.virustotal.com/gui/file/{sha256})  \n"
              f"* **Pithus:** [Static analysis](https://beta.pithus.org/report/{sha256})"
          )
          
          m = re.search(r"(?:\n+---)?\n*(\*\*Full Changelog\*\*:[^\n]*)$", body)
          if m:
              prefix = body[:m.start()].rstrip()
              changelog = m.group(1).strip()
              parts = [p for p in (prefix, security, changelog) if p]
              print("\n\n---\n\n".join(parts))
          else:
              parts = [p for p in (body, security) if p]
              print("\n\n---\n\n".join(parts))
          PY
          )
          
          gh release edit "${{ github.ref_name }}" --notes "$NEW_BODY"

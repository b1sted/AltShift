plugins {
    id 'com.android.application'
}

def releaseSigningConfigured = System.getenv("KEYSTORE_FILE") != null

android {
    namespace 'ru.b1sted.altshift'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.b1sted.altshift'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '0.4.2'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Local builds stay unsigned; tagged CI builds sign with the
            // keystore injected through the environment.
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // Pinned to the newest releases compatible with compileSdk 34.
        disable += 'GradleDependency'
    }

    // Keep the proprietary Play PKDS metadata block out of the APK signature
    // so independent security scanners see a clean artifact.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def type = variant.buildType.name == 'release' ? '' : "-${variant.buildType.name}"
            def unsigned = variant.buildType.name == 'release' && !releaseSigningConfigured
                    ? '-unsigned'
                    : ''
            outputFileName = "AltShift-v${defaultConfig.versionName}${type}${unsigned}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
}

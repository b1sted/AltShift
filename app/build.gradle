plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.b1sted.altshift'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.b1sted.altshift'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.4.1'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    lint {
        // Pinned to the newest releases compatible with compileSdk 34.
        disable += 'GradleDependency'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def type = variant.buildType.name == 'release' ? '' : "-${variant.buildType.name}"
            outputFileName = "AltShift-v${defaultConfig.versionName}${type}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
}
